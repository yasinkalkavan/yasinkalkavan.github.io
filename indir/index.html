<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BudgetHome'u indir</title>
<meta name="description" content="Kişisel, aile ve grup bütçesi tek uygulamada. iPhone ve Android'de ücretsiz.">
<meta property="og:title" content="BudgetHome – Bütçe ve Hesaplaşma">
<meta property="og:description" content="Kişisel, aile ve grup bütçesi tek uygulamada. iPhone ve Android'de ücretsiz.">
<meta property="og:image" content="og.png">
<meta property="og:type" content="website">
<link rel="icon" href="icon.png">
<script>
  // Cihaza göre doğru mağazaya otomatik yönlendirme
  (function () {
    var IOS = "https://apps.apple.com/app/budgethome/id6818601252";
    var ANDROID = "https://play.google.com/store/apps/details?id=com.budgethome.app";
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    if (isIOS) { window.location.replace(IOS); }
    else if (isAndroid) { window.location.replace(ANDROID); }
  })();
</script>
<style>
  :root { --bg:#0B1B2E; --card:#12263D; --text:#FFFFFF; --muted:#B7C9DA; }
  @media (prefers-color-scheme: light) { :root { --bg:#EEF4FA; --card:#FFFFFF; --text:#0B1B2E; --muted:#4A6075; } }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .card { width:100%; max-width:420px; background:var(--card); border-radius:28px; padding:40px 28px; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.25); }
  img { width:112px; height:112px; border-radius:26px; }
  h1 { font-size:30px; margin-top:20px; }
  p { color:var(--muted); font-size:17px; line-height:1.45; margin-top:10px; }
  .btns { display:flex; flex-direction:column; gap:12px; margin-top:28px; }
  a.b { display:block; text-decoration:none; font-weight:700; font-size:18px; padding:16px; border-radius:16px; background:#2E7BF6; color:#fff; }
  a.b.g { background:#16A34A; }
  small { display:block; margin-top:22px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
  <main class="card">
    <img src="icon.png" alt="BudgetHome simgesi">
    <h1>BudgetHome</h1>
    <p>Kişisel, aile ve grup bütçesi tek uygulamada.<br>Ücretsiz.</p>
    <div class="btns">
      <a class="b" href="https://apps.apple.com/app/budgethome/id6818601252">App Store'dan indir</a>
      <a class="b g" href="https://play.google.com/store/apps/details?id=com.budgethome.app">Google Play'den indir</a>
    </div>
    <small>Telefonundan açtığında doğru mağazaya otomatik yönlendirilirsin.</small>
  </main>
</body>
</html>
